# Ambiente local opcional: PHP 8.3 + Apache (lê o .htaccess) + MySQL + Mailpit.
# Uso: docker compose up -d → site em http://localhost:8080, e-mails em http://localhost:8025
# Crie app/config.php com db.host = "db", db.name = "fck_site", user "fck", senha "fck_dev".
services:
  web:
    image: php:8.3-apache
    ports: ['127.0.0.1:8080:80']
    volumes: ['.:/var/www/html']
    depends_on: [db]
    command: >
      bash -c "a2enmod rewrite headers expires deflate >/dev/null &&
               docker-php-ext-install pdo_mysql >/dev/null &&
               apt-get update -qq && apt-get install -y -qq libwebp-dev libjpeg-dev libpng-dev >/dev/null &&
               docker-php-ext-configure gd --with-webp --with-jpeg >/dev/null && docker-php-ext-install gd >/dev/null &&
               sed -ri 's/AllowOverride None/AllowOverride All/' /etc/apache2/apache2.conf && apache2-foreground"
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: fck_site
      MYSQL_USER: fck
      MYSQL_PASSWORD: fck_dev
      MYSQL_ROOT_PASSWORD: root_dev
    volumes: ['dbdata:/var/lib/mysql']
  mailpit:
    image: axllent/mailpit:latest
    ports: ['127.0.0.1:8025:8025']
volumes:
  dbdata:
